
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend
  namespace: blogreact
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-backend
  template:
    metadata:
      labels:
        app: blog-backend
    spec:
      containers:
        - name: backend
          image: 757884822355.dkr.ecr.ap-south-1.amazonaws.com/blog-backend:1.0.5
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: mysql-service
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: bloguser
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              value: blogdb
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: JWT_SECRET
            - name: CORS_ORIGIN
              value: "*"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: blog-backend
  namespace: blogreact
spec:
  type: ClusterIP
  selector:
    app: blog-backend
  ports:
    - port: 5000
      targetPort: 5000
