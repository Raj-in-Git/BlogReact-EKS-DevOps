
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-frontend
  namespace: blogreact
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-frontend
  template:
    metadata:
      labels:
        app: blog-frontend
    spec:
      containers:
        - name: frontend
          image: 757884822355.dkr.ecr.ap-south-1.amazonaws.com/blog-frontend:1.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: blog-backend
            - name: BACKEND_PORT
              value: "5000"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: blog-frontend
  namespace: blogreact
spec:
  type: LoadBalancer
  selector:
    app: blog-frontend
  ports:
    - port: 80
      targetPort: 8080
