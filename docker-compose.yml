services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: blog-backend:1.0.5
    container_name: blog-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: blog-mysql
      DB_PORT: 3306
      DB_USER: bloguser
      DB_PASSWORD: blogpassword
      DB_NAME: blogdb
      JWT_SECRET: local-docker-secret
      CORS_ORIGIN: http://localhost:8080
    ports:
    - "5000:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - blog-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: blog-frontend:1.0.2
    container_name: blog-frontend
    restart: unless-stopped
    environment:
      BACKEND_HOST: blog-backend
      BACKEND_PORT: "5000"
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blog-network

networks:
  blog-network:
    external: true

